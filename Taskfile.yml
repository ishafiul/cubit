version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    desc: 'Single command: start infra, build web assets (if needed), and run cubitd at :8000'
    cmds:
      - task: infra-up
      - cmd: |
          if [ ! -d "web/dist" ]; then
            task build-web
          fi
      - echo "==> Starting cubitd control plane at http://localhost:8000..."
      - go run cmd/cubitd/main.go

  infra-up:
    desc: Start background Docker infrastructure (Garage S3, Traefik, celld)
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d garage traefik celld

  infra-down:
    desc: Stop all Docker infrastructure containers
    cmds:
      - docker compose -f deploy/docker-compose.yml down

  infra-logs:
    desc: Follow Docker infrastructure logs
    cmds:
      - docker compose -f deploy/docker-compose.yml logs -f

  build-web:
    desc: Install npm packages and build web/dist
    dir: web
    cmds:
      - npm install
      - npm run build

  build-bin:
    desc: Compile cubitd Go binary
    cmds:
      - mkdir -p bin
      - go build -o bin/cubitd cmd/cubitd/main.go

  build:
    desc: Build both frontend and backend
    deps: [build-web, build-bin]

  dev-ui:
    desc: Run Vite dev server with HMR at :5173
    dir: web
    cmds:
      - npm run dev

  test-go:
    desc: Run Go tests with race detector
    cmds:
      - go test -race -v ./...

  test-web:
    desc: Run Vitest frontend tests
    dir: web
    cmds:
      - npm test

  test:
    desc: Run all backend and frontend tests
    cmds:
      - task: test-go
      - task: test-web

  clean:
    desc: Clean build artifacts and databases
    cmds:
      - rm -rf bin/ web/dist/ cubit.db cubit.db-shm cubit.db-wal
