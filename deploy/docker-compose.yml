services:
  # ============================================================================
  # Cubit Control Plane Daemon
  # Provides OpenAPI 3.1 REST API, SSE live build logs, and React 19 web dashboard
  # ============================================================================
  cubitd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cubit/cubitd:latest
    container_name: cubitd
    restart: unless-stopped
    ports:
      - "${CUBIT_PORT:-9400}:8000"
    environment:
      - CUBIT_PORT=8000
      - CUBIT_DB_PATH=/var/lib/cubit/cubit.db
      - CUBIT_TRAEFIK_DYNAMIC_PATH=/etc/traefik/dynamic/cubit.yaml
      - CUBIT_STORAGE_BACKEND=garage_s3
      - CUBIT_STORAGE_DIR=/var/lib/cubit/storage
      - CUBIT_CELLD_IMAGE=ghcr.io/denoland/celld:0.6.2
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cubit_data:/var/lib/cubit
      - traefik_dynamic:/etc/traefik/dynamic
    depends_on:
      - traefik
      - garage
    networks:
      - cubit_net

  # ============================================================================
  # Traefik v3 Reverse Proxy & Ingress Controller
  # Automates dynamic routing, SSL/TLS certificates, and load balancing
  # ============================================================================
  traefik:
    image: traefik:v3.3
    container_name: cubit-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-9481}:8080" # Traefik Dashboard
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - traefik_dynamic:/etc/traefik/dynamic
      - traefik_certs:/etc/traefik/certs
    networks:
      - cubit_net

  # ============================================================================
  # Garage S3 Distributed Object Storage Engine
  # Lightweight Rust-based distributed storage for Worker bundles and Durable Objects
  # ============================================================================
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: cubit-garage
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC
      - "3902:3902" # S3 Web
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - cubit_net

  # ============================================================================
  # celld Edge Worker & Durable Object Daemon
  # High-performance V8 isolate runtime powered by Deno Land
  # ============================================================================
  celld:
    image: ghcr.io/denoland/celld:0.6.2
    container_name: celld
    restart: unless-stopped
    ports:
      - "${CELLD_PORT:-9480}:8080"
    command:
      - "--bucket"
      - "s3://cubit-fleet"
      - "--endpoint"
      - "http://garage:3900"
      - "--region"
      - "cubit-local"
      - "--listen"
      - "0.0.0.0:8080"
      - "--internal-listen"
      - "0.0.0.0:8081"
      - "--advertise"
      - "celld:8081"
    environment:
      - S3_ENDPOINT=http://garage:3900
      - CELLD_BUCKET=s3://cubit-fleet
      - AWS_REGION=cubit-local
      - AWS_ACCESS_KEY_ID=${GARAGE_ACCESS_KEY:-GKe68794adce2c6d38351d96ef}
      - AWS_SECRET_ACCESS_KEY=${GARAGE_SECRET_KEY:-d52b4fcda143ed470b456cd1148b35d4ec57022928ba37af0818560b34c54a47}
      - AWS_ALLOW_HTTP=true
      # celld v0.6.2 epoch retention & memory limit configurations:
      - CELLD_LTX_RETENTION_SECS=86400 # 24h retention before epoch GC (actively runs on bucket durability nodes)
      - CELLD_MAX_ASSET_FILE_BYTES=26214400 # 25 MiB asset limit
      - CELLD_MAX_DYNAMIC_WORKER_CODE_BYTES=67108864 # 64 MiB dynamic worker code limit
    networks:
      - cubit_net

networks:
  cubit_net:
    name: cubit_net
    driver: bridge

volumes:
  cubit_data:
    name: cubit_data
  traefik_dynamic:
    name: traefik_dynamic
  traefik_certs:
    name: traefik_certs
  garage_meta:
    name: garage_meta
  garage_data:
    name: garage_data
