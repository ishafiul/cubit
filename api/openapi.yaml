openapi: 3.1.0
info:
  title: Cubit Control Plane API
  version: 1.0.0
  description: >-
    Strict REST API for Cubit, an open-source bare-metal PaaS for running
    Cloudflare Workers and Durable Objects using celld, Traefik, and S3 storage.
servers:
  - url: /api/v1
    description: Cubit API v1

paths:
  /nodes:
    get:
      summary: List all fleet nodes
      operationId: listNodes
      tags:
        - nodes
      responses:
        '200':
          description: A list of registered bare-metal nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Register a new bare-metal node
      operationId: createNode
      tags:
        - nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: Node registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get node details by ID
      operationId: getNode
      tags:
        - nodes
      responses:
        '200':
          description: Node details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Deregister a node from the fleet
      operationId: deleteNode
      tags:
        - nodes
      responses:
        '204':
          description: Node successfully removed
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /nodes/{id}/drain:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Drain a node to safely migrate its active Durable Object leases
      operationId: drainNode
      tags:
        - nodes
      responses:
        '200':
          description: Node drained successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /nodes/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Reactivate a drained node to accept workloads and traffic
      operationId: activateNode
      tags:
        - nodes
      responses:
        '200':
          description: Node activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications:
    get:
      summary: List all applications
      operationId: listApplications
      tags:
        - applications
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a new application
      operationId: createApplication
      tags:
        - applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get application details
      operationId: getApplication
      tags:
        - applications
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Update application configuration
      operationId: updateApplication
      tags:
        - applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete an application and clean up its routes
      operationId: deleteApplication
      tags:
        - applications
      responses:
        '204':
          description: Application deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/metrics:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get execution telemetry metrics for an application
      operationId: getApplicationMetrics
      tags:
        - applications
      responses:
        '200':
          description: Application execution metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationMetrics'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/deploy:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Trigger a new deployment for an application
      operationId: deployApplication
      tags:
        - deployments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '202':
          description: Deployment accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/deploy/direct:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Direct bundle deployment (e.g. from wrangler CLI or CI/CD)
      operationId: deployDirect
      tags:
        - deployments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployDirectRequest'
          multipart/form-data:
            schema:
              type: object
              properties:
                bundle:
                  type: string
                  format: binary
                commitMessage:
                  type: string
                wranglerConfig:
                  type: string
      responses:
        '201':
          description: Direct deployment deployed and active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/deployments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List deployment history for an application
      operationId: listDeployments
      tags:
        - deployments
      responses:
        '200':
          description: Deployment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Rollback application to a specific past deployment
      operationId: rollbackApplication
      tags:
        - deployments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackApplicationRequest'
      responses:
        '200':
          description: Application rolled back successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/bundle:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: deploymentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
    get:
      summary: Download the compiled JavaScript worker bundle
      operationId: getApplicationBundle
      tags:
        - applications
      responses:
        '200':
          description: Compiled JavaScript bundle code
          content:
            application/javascript:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/wrangler/import:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Import and synchronize wrangler.json or wrangler.toml configuration
      operationId: importWranglerConfig
      tags:
        - applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WranglerImportRequest'
      responses:
        '200':
          description: Configuration parsed and imported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WranglerImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /applications/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Send a test HTTP request to the active deployment of an application
      operationId: testApplication
      tags:
        - applications
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestApplicationRequest'
      responses:
        '200':
          description: Result of the test invocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /deployments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get deployment details and status
      operationId: getDeployment
      tags:
        - deployments
      responses:
        '200':
          description: Deployment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /deployments/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get deployment build and execution logs
      operationId: getDeploymentLogs
      tags:
        - deployments
      responses:
        '200':
          description: Build logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentLogEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /domains:
    get:
      summary: List all custom domain bindings
      operationId: listDomains
      tags:
        - domains
      responses:
        '200':
          description: List of custom domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Add a custom domain route
      operationId: createDomain
      tags:
        - domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainRequest'
      responses:
        '201':
          description: Domain route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /domains/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Remove a custom domain route
      operationId: deleteDomain
      tags:
        - domains
      responses:
        '204':
          description: Domain deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /runtime/status:
    get:
      summary: Get fleet runtime status and celld version information
      operationId: getRuntimeStatus
      tags:
        - runtime
      responses:
        '200':
          description: Runtime status across fleet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '500':
          $ref: '#/components/responses/InternalError'

  /runtime/upgrade:
    post:
      summary: Trigger zero-downtime rolling upgrade of the celld daemon across nodes
      operationId: upgradeCelldDaemon
      tags:
        - runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeDaemonRequest'
      responses:
        '202':
          description: Rolling upgrade initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /r2/buckets:
    get:
      summary: List all R2 storage buckets
      operationId: listR2Buckets
      tags:
        - r2
      responses:
        '200':
          description: List of R2 storage buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/R2Bucket'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a new custom R2 bucket
      operationId: createR2Bucket
      tags:
        - r2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateR2BucketRequest'
      responses:
        '201':
          description: Bucket created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R2Bucket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /r2/buckets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Delete an R2 bucket (protected fleet buckets cannot be deleted)
      operationId: deleteR2Bucket
      tags:
        - r2
      responses:
        '204':
          description: Bucket deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /r2/buckets/{name}/objects:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List all objects in an R2 bucket
      operationId: listR2Objects
      tags:
        - r2
      responses:
        '200':
          description: List of objects in the bucket
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/R2Object'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /r2/buckets/{name}/upload:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Upload an object into an R2 bucket
      operationId: uploadR2Object
      tags:
        - r2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadR2ObjectRequest'
      responses:
        '200':
          description: Object uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  key:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /r2/buckets/{name}/objects/{key}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get raw object contents from an R2 bucket
      operationId: getR2Object
      tags:
        - r2
      responses:
        '200':
          description: Object binary or text content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete an object from an R2 bucket
      operationId: deleteR2Object
      tags:
        - r2
      responses:
        '204':
          description: Object deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: Bad request / validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict with existing resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden operation on protected or restricted resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    R2Bucket:
      type: object
      required:
        - name
        - createdAt
        - objectsCount
        - sizeBytes
      properties:
        name:
          type: string
          example: "user-assets"
        objectsCount:
          type: integer
          example: 4
        sizeBytes:
          type: integer
          format: int64
          example: 1048576
        isSystem:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    CreateR2BucketRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "user-assets"

    R2Object:
      type: object
      required:
        - key
        - sizeBytes
        - contentType
        - etag
        - lastModified
      properties:
        key:
          type: string
          example: "avatars/user-123.png"
        sizeBytes:
          type: integer
          format: int64
          example: 20480
        contentType:
          type: string
          example: "image/png"
        etag:
          type: string
          example: "\"d41d8cd98f00b204e9800998ecf8427e\""
        lastModified:
          type: string
          format: date-time

    UploadR2ObjectRequest:
      type: object
      required:
        - key
        - content
      properties:
        key:
          type: string
          example: "data.json"
        content:
          type: string
          description: Raw or base64 text content of the object

    NodeStatus:
      type: string
      enum:
        - active
        - draining
        - offline

    NodeSpecs:
      type: object
      properties:
        cpuCores:
          type: integer
          example: 8
        memoryBytes:
          type: integer
          format: int64
          example: 17179869184
        diskFreeBytes:
          type: integer
          format: int64
          example: 107374182400

    Node:
      type: object
      required:
        - id
        - name
        - ipAddress
        - internalPort
        - workerPort
        - status
        - celldVersion
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "node-london-1"
        ipAddress:
          type: string
          example: "192.168.1.50"
        internalPort:
          type: integer
          default: 8081
        workerPort:
          type: integer
          default: 8080
        status:
          $ref: '#/components/schemas/NodeStatus'
        celldVersion:
          type: string
          example: "0.2.0"
        specs:
          $ref: '#/components/schemas/NodeSpecs'
        isProtected:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    CreateNodeRequest:
      type: object
      required:
        - name
        - ipAddress
      properties:
        name:
          type: string
          example: "node-frankfurt-1"
        ipAddress:
          type: string
          example: "10.0.0.12"
        internalPort:
          type: integer
          default: 8081
        workerPort:
          type: integer
          default: 8080

    EnvironmentVariable:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          example: "API_SECRET"
        value:
          type: string
          example: "secret_val_123"
        isSecret:
          type: boolean
          default: false

    ResourceBinding:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum: [kv_namespace, d1_database, r2_bucket, queue, workflow, service]
        name:
          type: string
          example: "MY_KV"
        resourceId:
          type: string
          example: "kv_store_app1"

    SourceType:
      type: string
      enum: [git, inline]
      default: git

    Application:
      type: object
      required:
        - id
        - name
        - sourceType
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "my-worker-api"
        sourceType:
          $ref: '#/components/schemas/SourceType'
        subdomain:
          type: string
          example: "my-worker-api"
        testUrl:
          type: string
          example: "http://my-worker-api.localhost:8000"
        gitRepo:
          type: string
          nullable: true
          example: "https://github.com/myorg/api"
        branch:
          type: string
          default: "main"
        inlineCode:
          type: string
          nullable: true
          example: "export default { fetch: (req) => new Response('Hello World!') };"
        status:
          type: string
          enum: [created, building, running, stopped, failed]
        envVars:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ResourceBinding'
        activeDeploymentId:
          type: string
          format: uuid
          nullable: true
        compatibilityDate:
          type: string
          example: "2024-09-23"
        compatibilityFlags:
          type: array
          items:
            type: string
          example: ["nodejs_compat"]
        memoryLimitMb:
          type: integer
          example: 128
        maxDurationMs:
          type: integer
          example: 50
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WranglerImportRequest:
      type: object
      required:
        - rawConfig
      properties:
        rawConfig:
          type: string
          description: Raw content of wrangler.json, wrangler.jsonc, or wrangler.toml
        format:
          type: string
          enum: [auto, json, toml]
          default: auto
        env:
          type: string
          description: Optional environment name override (e.g. staging, production)

    WranglerImportResult:
      type: object
      required:
        - success
        - message
        - importedVarsCount
        - preservedSecretsCount
        - importedBindingsCount
        - application
      properties:
        success:
          type: boolean
        message:
          type: string
        name:
          type: string
        main:
          type: string
        compatibilityDate:
          type: string
        compatibilityFlags:
          type: array
          items:
            type: string
        importedVarsCount:
          type: integer
        preservedSecretsCount:
          type: integer
        importedBindingsCount:
          type: integer
        cronsCount:
          type: integer
        detectedFormat:
          type: string
        application:
          $ref: '#/components/schemas/Application'

    ApplicationMetrics:
      type: object
      required:
        - totalRequests
        - status2xx
        - status4xx
        - status5xx
        - avgDurationMs
        - p99DurationMs
      properties:
        totalRequests:
          type: integer
          example: 1240
        status2xx:
          type: integer
          example: 1200
        status4xx:
          type: integer
          example: 35
        status5xx:
          type: integer
          example: 5
        avgDurationMs:
          type: number
          format: float
          example: 12.4
        p99DurationMs:
          type: number
          format: float
          example: 45.2
        successRate:
          type: number
          format: float
          example: 98.5
        errorRate:
          type: number
          format: float
          example: 1.5
        requestsByCountry:
          type: object
          additionalProperties:
            type: integer
          example:
            US: 120
            GB: 45
        requestsByColo:
          type: object
          additionalProperties:
            type: integer
          example:
            SFO: 110
            IAD: 40
        lastInvokedAt:
          type: string
          format: date-time
          nullable: true
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/RequestLogEvent'

    ConsoleLogEntry:
      type: object
      required:
        - level
        - message
        - timestamp
      properties:
        level:
          type: string
          example: log
        message:
          type: string
          example: Handling request for /api/users
        timestamp:
          type: integer
          format: int64
          example: 1726974900000

    RequestLogEvent:
      type: object
      required:
        - id
        - timestamp
        - method
        - path
        - url
        - statusCode
        - durationMs
        - clientIp
      properties:
        id:
          type: string
          example: ray_9fa28bc3a120
        timestamp:
          type: string
          format: date-time
        method:
          type: string
          example: GET
        path:
          type: string
          example: /api/users
        url:
          type: string
          example: http://hello-world.localhost:8000/api/users
        statusCode:
          type: integer
          example: 200
        durationMs:
          type: number
          format: float
          example: 12.4
        clientIp:
          type: string
          example: 127.0.0.1
        message:
          type: string
          example: Worker isolate request executed
        outcome:
          type: string
          example: ok
        requestHeaders:
          type: object
          additionalProperties:
            type: string
        requestBody:
          type: string
        responseHeaders:
          type: object
          additionalProperties:
            type: string
        responseBody:
          type: string
        logs:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleLogEntry'
        exceptions:
          type: array
          items:
            type: string
        cf:
          type: object
          description: Cloudflare edge context and geolocation telemetry
          additionalProperties: true

    CreateApplicationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "my-worker-api"
        sourceType:
          $ref: '#/components/schemas/SourceType'
        gitRepo:
          type: string
          example: "https://github.com/myorg/api"
        branch:
          type: string
          default: "main"
        inlineCode:
          type: string
          example: "export default { fetch: (req) => new Response('Hello World from Cubit!') };"
        envVars:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ResourceBinding'

    UpdateApplicationRequest:
      type: object
      properties:
        branch:
          type: string
        inlineCode:
          type: string
        envVars:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ResourceBinding'
        compatibilityDate:
          type: string
          example: "2024-09-23"
        compatibilityFlags:
          type: array
          items:
            type: string
        memoryLimitMb:
          type: integer
          example: 128
        maxDurationMs:
          type: integer
          example: 50

    TestApplicationRequest:
      type: object
      properties:
        method:
          type: string
          example: "GET"
          default: "GET"
        path:
          type: string
          example: "/"
          default: "/"
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string

    TestApplicationResponse:
      type: object
      required:
        - statusCode
        - body
      properties:
        statusCode:
          type: integer
          example: 200
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
          example: "Hello World from Cubit!"

    DeploymentStatus:
      type: string
      enum:
        - pending
        - building
        - deploying
        - active
        - failed
        - superseded

    Deployment:
      type: object
      required:
        - id
        - applicationId
        - commitHash
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        buildVersion:
          type: integer
          example: 1
          description: "Sequential build version for this application (e.g. 1 for v1)"
        commitHash:
          type: string
          example: "7f8b92c"
        commitMessage:
          type: string
          example: "feat: Add new payment endpoint"
        status:
          $ref: '#/components/schemas/DeploymentStatus'
        bundleSize:
          type: integer
          example: 452000
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    CreateDeploymentRequest:
      type: object
      properties:
        commitHash:
          type: string
        forceRebuild:
          type: boolean
          default: false

    DeployDirectRequest:
      type: object
      required:
        - bundle
      properties:
        bundle:
          type: string
          description: JavaScript bundle code
        commitMessage:
          type: string
          description: Optional deployment message or commit description
        wranglerConfig:
          type: string
          description: Optional wrangler.json or wrangler.toml configuration content

    RollbackApplicationRequest:
      type: object
      required:
        - deploymentId
      properties:
        deploymentId:
          type: string
          format: uuid
          example: "018f9e61-9c12-7000-8111-c91836a94f09"

    DeploymentLogEntry:
      type: object
      required:
        - timestamp
        - step
        - message
        - level
      properties:
        timestamp:
          type: string
          format: date-time
        step:
          type: string
          enum: [git_clone, esbuild, s3_upload, celld_deploy, route_sync]
        message:
          type: string
          example: "Building bundle using esbuild..."
        level:
          type: string
          enum: [info, warn, error]

    Domain:
      type: object
      required:
        - id
        - applicationId
        - hostname
        - pathPrefix
        - sslActive
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        hostname:
          type: string
          example: "api.mycustomdomain.com"
        pathPrefix:
          type: string
          default: "/"
        sslActive:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    CreateDomainRequest:
      type: object
      required:
        - applicationId
        - hostname
      properties:
        applicationId:
          type: string
          format: uuid
        hostname:
          type: string
          example: "api.mycustomdomain.com"
        pathPrefix:
          type: string
          default: "/"

    RuntimeStatus:
      type: object
      required:
        - activeNodesCount
        - currentCelldVersion
        - isUpgrading
      properties:
        activeNodesCount:
          type: integer
          example: 3
        currentCelldVersion:
          type: string
          example: "0.2.0"
        targetCelldVersion:
          type: string
          nullable: true
          example: "0.3.0"
        isUpgrading:
          type: boolean
          example: false
        storageBackend:
          type: string
          enum: [garage_local, cloudflare_r2, aws_s3, custom_s3]
          example: "garage_local"

    UpgradeDaemonRequest:
      type: object
      required:
        - targetVersion
      properties:
        targetVersion:
          type: string
          example: "0.3.0"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Application with ID not found"
        details:
          type: array
          items:
            type: string
          nullable: true
